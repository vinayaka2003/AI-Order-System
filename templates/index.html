<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Order Assistant</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="chat-section">

        <div class="top-bar">

            <div>

                <h1>AI Order Assistant</h1>
                <p>Ask the assistant to create and manage your grocery orders</p>
            </div>

            <a href="/logout"
               class="logout-btn">
               Logout
            </a>

        </div>

        <div class="chat-box"
             id="response">

            <div class="ai-message">

                Welcome 👋 <br><br>

                Example:
                "I want 2 bananas and 3 apples"

            </div>

        </div>

        <div class="input-area">

            <div class="input-wrapper">

                <input type="text"
                       id="message"
                       placeholder="Message AI Assistant...">

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </div>

    <div class="side-panel">

        <div class="card">

            <h2>Order Details</h2>

            <div id="current-order">

                No active order

            </div>

        </div>

        <div class="card history-card">

            <h2>History</h2>

            <div id="orders-list">

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static',
filename='script.js') }}"></script>

</body>
</html>
