<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>AI Order Assistant</h1>

        <p>Login to continue</p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="login-info">

            Username: admin <br>
            Password: admin123

        </div>

    </div>

</div>

</body>
</html>
